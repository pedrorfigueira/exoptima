[project]
name = "exoptima"
version = "2.0.0"
description = "Exoplanets Observation Preparation Tool for Instrumentation and Mission Analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["astronomy", "scheduling", "observations"]
requires-python = ">=3.10"
authors = [
    { name = "Pedro Figueira", email = "pedro.figueira@iaa.es" }
]

dependencies = [
    "panel>=1.6",
    "numpy>=1.26",
    "astropy>=6.0",
    "astroquery",
    "astroplan",
    "matplotlib",
]

[project.scripts]
exoptima = "exoptima.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["exoptima*"]
exclude = ["workspace*"]

[tool.setuptools.package-data]
exoptima = ["assets/*"]

[project.urls]
Homepage = "https://github.com/pedrorfigueira/exoptima"
Repository = "https://github.com/pedrorfigueira/exoptima"
